spring:
  application:
    name: agripulse-backend
  profiles:
    active: dev

  # Datasource is provided per profile (dev / test / mysql).
  # All credentials come from environment variables - nothing secret is hardcoded.

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:agripulse-dev-jwt-secret-change-in-production-must-be-at-least-256-bits}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
